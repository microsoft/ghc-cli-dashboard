title: Copilot CLI Usage Dashboard
description: >-
  An experimental local dashboard for exploring GitHub Copilot CLI usage.
theme: jekyll-theme-cayman

# GitHub Pages serves README.md as the landing page and rewrites relative
# links between Markdown files via the jekyll-relative-links plugin.
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

# Jekyll only applies a layout to files that have YAML front matter, so each
# published page carries its own front matter. index.md includes README.md so
# the README itself stays free of front matter in the GitHub file view.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# This site is documentation only. It never builds or publishes a dashboard,
# because generated dashboards embed personal usage data.
exclude:
  - "*.py"
  - tests/
  - requirements.txt
  - requirements-dev.txt
  - "*.csv"
  - "*.html"
